# Paste this into Streamlit Cloud → your app → Settings → Secrets, with your real values.
# Never upload a filled-in copy to GitHub.

DA_PUBLIC = "true"            # public mode: keys and settings are hidden from visitors

# AI model: Google Gemini (free key at aistudio.google.com)
DA_BASE_URL = "https://generativelanguage.googleapis.com/v1beta/openai/"
DA_API_KEY = "paste-your-gemini-key"
DA_MODEL = "gemini-3.7-flash"
DA_FALLBACK_MODEL = "gemini-3.8-flash"   # used automatically if the main model is overloaded

# Web search (tavily.com)
TAVILY_API_KEY = "tvly-paste-your-key"

# Optional: shared database (supabase.com). Without it, debates reset when the app restarts.
# SUPABASE_URL = "https://xxxxxxxx.supabase.co"
# SUPABASE_KEY = "paste-the-anon-public-key"

# Optional: password for the team CSV export on the Community page
# ADMIN_PASSWORD = "choose-a-team-password"
